<style>

0 0 5px}.muted{color:var(--sub);font-size:12px}.btn{border:1px solid #cbd3dd;background:white;color:#37475a;padding:8px 13px;border-radius:6px;font-size:13px}.btn:hover{background:var(--hover)}.btn.primary{background:#2464b5;color:white;border-color:#2464b5}.btn.primary:hover{background:#18549e}.btn.tiny{font-size:12px;padding:5px 9px}.board-details{display:flex;gap:8px;align-items:center;margin-top:9px;flex-wrap:wrap}.board-details button{background:transparent;border:0;font-size:12px;color:var(--sub);padding:3px 4px}.details-content{background:#fff;border:1px solid var(--line);border-radius:8px;padding:15px;margin-bottom:12px;font-size:13px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:22px;align-items:start}.main{min-width:0}.panel{border:1px solid var(--line);background:var(--panel);border-radius:9px}.toolbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:13px;border-bottom:1px solid var(--line)}.tabs{display:flex;gap:3px}.tab{padding:8px 12px;border:0;border-radius:6px;background:transparent;color:var(--sub);font-size:13px}.tab.active{background:#e9f2ff;color:#164c92;font-weight:700}.toolbar .right-controls{margin-left:auto;display:flex;gap:7px;align-items:center;flex-wrap:wrap}.search{min-width:145px;width:220px;border:1px solid #d6dce3;padding:7px 10px;border-radius:6px;background:#fff;font-size:13px}.select{border:1px solid #d6dce3;background:#fff;border-radius:6px;padding:7px;font-size:12px;color:#465565}.info{padding:10px 16px;border-bottom:1px solid var(--line);background:#fafdff;color:var(--sub);font-size:12px}.thread-card{padding:18px 20px 13px;border-bottom:1px solid var(--line)}.thread-card:last-child{border-bottom:0}.thread-meta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--sub);font-size:12px}.thread-card h2{font-size:17px;margin:6px 0 8px;font-weight:650;line-height:1.5}.thread-card h2 a{color:#22384f}.thread-card h2 a:hover{color:var(--blue)}.post{padding:var(--postspace) 0;border-bottom:1px solid #e8ebee;overflow-wrap:anywhere}.post:last-child{border-bottom:0}.post-top{font-size:12px;color:#6b7988;margin-bottom:6px}.post-top .name{color:#265078;font-weight:650}.post-body{font-size:14px;line-height:1.75;white-space:pre-wrap;padding-left:5px}.post-footer{display:flex;align-items:center;gap:12px;margin-top:8px;color:var(--sub);font-size:12px}.linkbtn{border:0;background:transparent;padding:0;color:var(--blue);font-size:12px}.linkbtn:hover{text-decoration:underline}.summary-post{padding:9px 0}.summary-post .post-body{color:#303741}.summary-post .post-top{font-size:11px}.expand-actions{display:flex;gap:13px;margin-top:12px}.thread-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;flex-wrap:wrap}.badge{border-radius:4px;background:#edf3f9;color:#46627b;padding:2px 6px;font-size:11px}.badge.old{background:#fff4dc;color:#7a5e26}.side{position:sticky;top:81px}.side .panel{padding:17px;margin-bottom:14px}.side h3{font-size:14px;margin:0 0 12px}.side p,.side li{font-size:12px;color:#61707e;line-height:1.7}.side ul{padding-left:15px;margin:5px 0}.divider{border:0;border-top:1px solid var(--line);margin:14px 0}.list-head,.list-row{display:grid;grid-template-columns:minmax(0,1fr) 85px 60px 72px;gap:10px;align-items:center}.list-head{font-size:12px;color:var(--sub);padding:12px 16px;background:#f9fafb;border-bottom:1px solid var(--line)}.list-row{padding:11px 16px;border-bottom:1px solid var(--line);font-size:13px}.list-row:last-child{border-bottom:0}.list-row:hover{background:#fafdff}.list-row a{overflow-wrap:anywhere}.num{text-align:right;font-variant-numeric:tabular-nums}.loading{padding:22px;text-align:center;font-size:13px;color:var(--sub)}.thread-title{font-size:21px;line-height:1.5;margin:4px 0 8px}.thread-actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:10px 0 17px}.notice{border-left:3px solid #d8a64b;background:#fff9e8;padding:9px 13px;font-size:12px;margin-bottom:14px}.thread-panel{padding:3px 21px}.thread-panel .post{padding:18px 0}.thread-panel .post-body{font-size:15px}.compose{padding:17px;margin-top:16px}.compose h3{margin:0 0 12px;font-size:15px}.compose textarea{width:100%;min-height:115px;resize:vertical;border:1px solid var(--line);border-radius:6px;padding:10px}.compose input{border:1px solid var(--line);border-radius:6px;padding:8px;max-width:230px;width:100%}.compose-fields{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:9px}.compose-foot{display:flex;justify-content:space-between;align-items:center;margin-top:9px;gap:10px}.modal-bg{position:fixed;inset:0;background:#17202a88;z-index:50;display:grid;place-items:center;padding:15px}.modal{width:min(100%,520px);background:white;border-radius:10px;padding:22px;max-height:88vh;overflow:auto}.modal h2{margin:0 0 12px;font-size:19px}.modal label{display:block;font-size:12px;color:var(--sub);margin:9px 0 5px}.modal input,.modal textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:9px}.modal textarea{min-height:100px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:17px}.footer{padding:45px 0 35px;text-align:center;color:var(--sub);font-size:12px}.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#263d53;color:white;padding:10px 16px;border-radius:7px;z-index:70;box-shadow:0 5px 15px #0002;font-size:13px}.empty{text-align:center;color:var(--sub);padding:35px}.compact .thread-card{padding-top:10px;padding-bottom:9px}.compact .post{--postspace:7px}.compact .summary-post{padding:4px 0}.compact .post-body{line-height:1.5}.setting-row{display:flex;align-items:center;justify-content:space-between;gap:15px;margin:10px 0}.mobile-switch{display:none}
@media(max-width:950px){.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px}.header-inner{gap:15px}.gnav{gap:12px}.shell{padding:0 13px}.board-head h1{font-size:21px}}
@media(max-width:660px){.global{height:54px}.header-inner{padding:0 13px}.logo{font-size:22px}.gnav{display:none}.account{gap:5px}.account .register{display:none}.mobile-menu{display:block;border:0;background:none;font-size:20px;color:#566675}.board-head{align-items:center}.board-head h1{font-size:19px}.board-head .btn{white-space:nowrap}.toolbar{padding:9px}.toolbar .right-controls{width:100%;margin-left:0}.search{width:100%;flex:1}.list-head,.list-row{grid-template-columns:minmax(0,1fr) 60px;gap:8px}.list-head span:nth-child(2),.list-head span:nth-child(3){display:none}.list-row .when,.list-row .speed{display:none}.thread-card{padding:15px 13px}.thread-card h2{font-size:16px}.thread-panel{padding:2px 13px}.thread-panel .post-body{font-size:14px}.thread-title{font-size:19px}.thread-actions{gap:4px}.thread-actions .btn{padding:6px 9px}.post-top{font-size:11px}.mobile-switch{display:block}.breadcrumbs{padding-top:12px}}

/* Related boards: always a single line; scroll sideways if the viewport is too narrow. */
.related-boards{font-size:12px;color:var(--sub);white-space:nowrap;max-width:min(100%,80vw);overflow-x:auto;scrollbar-width:thin}
.related-boards a{color:var(--blue)}
.tabs{min-width:0;flex-wrap:wrap}
@media(max-width:660px){.tab{padding:7px 9px;font-size:12px}.related-boards{max-width:calc(100vw - 40px)}}
/* Responsive layout: identical DOM on desktop/mobile; CSS only. */
.layout{align-items:start}
.side{min-width:0}
.side .panel{min-width:0}
.side .panel h3{margin-top:0}
.side .mini-item{padding:9px 0;border-bottom:1px solid var(--line)}
.side .mini-item:last-child{border-bottom:0}
.side .mini-item a{font-size:13px;line-height:1.5;display:block}
.side .mini-item .muted{display:block;margin-top:2px}
.side details summary{cursor:pointer;font-weight:600;font-size:14px}
.side details p{font-size:13px}
.feed-gap{margin:9px 0;display:flex;align-items:center;justify-content:center;gap:12px;padding:11px;background:#f6f8fc;border:1px dashed var(--line);border-radius:6px}
.feed-gap .muted{font-size:12px}
.feed-gap button{font-size:12px}
.sidebar-tabs{display:flex;gap:5px;margin:0 0 8px}
.sidebar-tabs button{font-size:12px;padding:6px 9px;border:1px solid var(--line);background:#fff;border-radius:5px}
.sidebar-tabs button.active{background:#eaf2ff;border-color:#b9d3f6;color:#195aa5;font-weight:700}
@media(max-width:950px){.side{display:grid;grid-template-columns:minmax(0,1fr);gap:12px;margin-top:14px}.side .panel{margin-bottom:0}}
@media(max-width:660px){.side{grid-template-columns:minmax(0,1fr)}.side .panel{padding:14px}.feed-gap{flex-wrap:wrap;text-align:center}}

<body>
<header class="global"><div class="header-inner"><a class="logo" href="#board" data-action="board">3<small>ちゃんねる</small></a><nav class="gnav"><a href="#board" data-action="board">ホーム</a><a href="#board" data-action="board">板一覧</a><a href="#board" data-action="focus-search">検索</a></nav><div class="account"><button class="register" id="register">認証・登録</button><button class="login" id="login">ログイン</button><div class="dropdown-wrap" id="userWrap" hidden><button id="userToggle">● デモユーザー ▾</button><div id="userDrop" class="dropdown" hidden><button data-action="settings">表示設定</button><button id="logout">ログアウト</button></div></div><button class="mobile-menu" id="mobileToggle" aria-label="ナビゲーション">☰</button><div class="dropdown" id="mobileDrop" hidden style="top:50px;right:8px"><button data-action="board">ホーム・板一覧</button><button data-action="focus-search">検索</button><button data-action="settings">表示設定</button></div></div></div></header>
<div class="shell"><div id="app"></div><footer class="footer">3ちゃんねる UI Prototype — レスポンシブはCSSのみ・操作はダミーデータ</footer></div>
<div id="modalHost"></div><div id="toast" class="toast" hidden></div>
<script>
(()=>{'use strict';
const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);const dataTitle=['3chのブラウザ版が新しくなるらしい','天の声「オータム…オータムよ聴こえますか」','掲示板の新機能について語るスレ','なんか重くね','SNSと匿名掲示板の違いを考える','スレッドフィードのUIを考える','今日の雑談スレ','おすすめのブラウザって何？','スレ一覧は表形式がいいよな','実況用の自動更新を試してみる','AAを貼っていくスレ','検索機能改善要望','PC版サイトが使いやすくなった','夜更かし雑談','新しい3chにほしい機能'];
const starters=['新しいUI、みんなはどう思う？\nここでは好きなだけ語ってください。','秋ですね。のんびり話しましょう。','新機能について意見募集しています。','ページの表示速度について報告してほしい。','匿名性と利便性、どちらも大事にしたい。','スクロールで古いスレまで辿れると便利そう。','今日も一日お疲れさまです。'];
let seq=0;const makeThread=(i,kind='board')=>{const id=++seq;const title=dataTitle[i%dataTitle.length]+(i>=dataTitle.length?` その${Math.floor(i/dataTitle.length)+1}`:'');return{id,title,kind,board:kind==='related'?['ニュース速報','なんでも実況','技術'][i%3]:'livegalileo',age:i*17+4,res:3+(i*7)%95,views:20+i*11,body:starters[i%starters.length],postList:[],loaded:1}};
let threads=Array.from({length:16},(_,i)=>makeThread(i));threads.push(...Array.from({length:12},(_,i)=>makeThread(i+16,'related')));const state={page:'board',mode:'feed',sort:'new',query:'',moreSource:'old',sideTab:'recent',batch:0,compact:false,logged:false,openBoards:false,threadId:threads[0].id,searchThread:'',shownPosts:30,showFull:false,expanded:new Map(),replies:new Map(),loading:false,finished:false};
function seedPosts(t){if(t.postList.length)return;t.postList=Array.from({length:Math.min(t.res,110)},(_,i)=>({n:i+1,name:i%5===0?'†nore ★':'名無しさん',text:i===0?t.body:[`>>${Math.max(1,i)}\nこれはなかなか良さそうだと思う`,`従来の2ch形式も残してほしい`,`レスの読みやすさが改善するといいね`,`>>1\n同意。実際に操作して比べてみたい`,`スレッドフィードも気になってる`,`表示設定で切り替えられると便利そう`][i%6],min:Math.max(1,t.age-i*2)}));t.postList.push(...(state.replies.get(t.id)||[]))}
function time(m){if(m<60)return m+'分前';if(m<1440)return Math.floor(m/60)+'時間前';return Math.floor(m/1440)+'日前'}
const postHTML=(p,brief=false)=>`<div class="post ${brief?'summary-post':''}"><div class="post-top"><span class="name">${escape(p.name)}</span>　${time(p.min)}　<span style="color:#9aa6b2">ID:${String(p.n*7919).slice(-7)}★</span>　<a href="#thread" data-action="reply-ref" data-ref="${p.n}">>>${p.n}</a></div><div class="post-body">${escape(p.text)}</div>${brief?'':`<div class="post-footer"><button class="linkbtn" data-action="reply-ref" data-ref="${p.n}">返信</button> <button class="linkbtn" data-action="copy-post" data-ref="${p.n}">番号をコピー</button></div>`}</div>`;
function chrome(inner,thread=false){return `<div class="breadcrumbs"><a href="#board" data-action="board">3ちゃんねる</a><span>›</span><a href="#board" data-action="board">BBS</a><span>›</span><a href="#board" data-action="board">livegalileo@3ch掲示板</a>${thread?'<span>›</span>スレッド':''}</div>${inner}`}
function details(){return `<div class="board-details"><button data-action="details" data-detail="rules">▸ ローカルルール</button><button data-action="details" data-detail="config">▸ 板設定</button></div><div id="rules" class="details-content" hidden>■ ローカルルール<br>荒らし・スパムは禁止です。書き込みの際は掲示板のルールをご確認ください。</div><div id="config" class="details-content" hidden>■ 板設定（デモ）<br>名無し：名無しさん / 最大レス数：1000 / 投稿形式：dat互換</div>`}
function sidebarList(items){return items.map(t=>`<div class="mini-item"><a href="#thread/${t.id}" data-thread="${t.id}">${escape(t.title)}</a><span class="muted">${escape(t.board)} · ${t.res}レス · ${time(t.age)}</span></div>`).join('')}
function side(){
 const isThread=state.page==='thread';
 const boardItems=threads.filter(t=>t.kind!=='related').slice(0,7);
 const items=isThread?(state.sideTab==='popular'?[...boardItems].sort((a,b)=>b.views-a.views):state.sideTab==='related'?boardItems.filter(t=>t.id!==state.threadId).slice(1):boardItems):[];
 return `<aside class="side" aria-label="関連情報">
 ${isThread?`<section class="panel"><h3>この板のスレッド</h3><div class="sidebar-tabs"><button class="${state.sideTab==='recent'?'active':''}" data-sidetab="recent">新着</button><button class="${state.sideTab==='popular'?'active':''}" data-sidetab="popular">勢い</button><button class="${state.sideTab==='related'?'active':''}" data-sidetab="related">関連</button></div>${sidebarList(items)}<p><a href="#board" data-action="board">板のスレ一覧を見る →</a></p></section>`:`<section class="panel"><details open><summary>ローカルルール</summary><p>実況・雑談を楽しむ板です。誹謗中傷、荒らし、スパムは禁止です。投稿前に利用規約をご確認ください。</p></details></section><section class="panel"><details><summary>板設定</summary><p>名無し：名無しさん<br>最大レス数：1000<br>スレッド形式：dat互換</p></details></section>`}
 ${isThread?`<section class="panel"><h3>おすすめ3ちゃんねる</h3>${sidebarList(threads.filter(t=>t.kind==='related').slice(0,5))}<p><a href="#board" data-action="recommendations">おすすめをもっと見る →</a></p></section><section class="panel"><details><summary>板情報・ローカルルール</summary><p>実況・雑談を楽しむ板です。荒らし・スパムは禁止です。</p></details></section>`:''}
 </aside>`
}
function getFiltered(){let xs=threads.filter(t=>(state.mode==='recommend'?t.kind==='related':t.kind!=='related')&&(!state.query||t.title.toLowerCase().includes(state.query.toLowerCase())));if(state.sort==='speed')xs.sort((a,b)=>b.views-a.views);if(state.sort==='res')xs.sort((a,b)=>b.res-a.res);return xs}
function card(t){
 seedPosts(t);
 const extra=state.expanded.get(t.id)||0;
 const all=t.postList;
 const start=all[0];
 const tail=all.length>1?all.slice(-Math.max(1,extra||1)):[];
 const oldest=tail.length?tail[0].n:0;
 const missing=Math.max(0,oldest-2);
 return `<article class="thread-card"><div class="thread-meta"><span class="badge ${t.kind==='related'?'old':''}">${t.kind==='related'?'他板関連':t.kind==='old'?'古いスレ':'この板'}</span><span>${escape(t.board)}</span><span>更新 ${time(t.age)}</span><span>${t.res} レス</span></div><h2><a href="#thread/${t.id}" data-thread="${t.id}">${escape(t.title)}</a></h2>
 <div class="summary-post">${postHTML(start,true)}</div>
 ${missing?`<div class="feed-gap"><span class="muted">${missing}件のレスを省略</span><button class="btn tiny" data-action="expand" data-id="${t.id}">${extra?'さらに前の100レス':'最新10レスを表示'} ↓</button></div>`:''}
 <div class="feed-tail">${tail.filter(p=>p.n!==1).map(p=>postHTML(p,true)).join('')}</div>
 <div class="thread-foot"><div class="expand-actions">${extra?`<button class="linkbtn" data-action="collapse" data-id="${t.id}">最新1レスに戻す</button>`:''}</div><a class="btn tiny" href="#thread/${t.id}" data-thread="${t.id}">スレッドを開く ›</a></div></article>`
}
function listRow(t){return `<div class="list-row"><div><a href="#thread/${t.id}" data-thread="${t.id}">${escape(t.title)}</a><div class="muted mobile-switch">${time(t.age)} · 勢い ${t.views}</div></div><div class="when">${time(t.age)}</div><div class="num speed">${t.views}</div><div class="num">${t.res}</div></div>`}
function board(){document.title='livegalileo@3ch掲示板 — 3ちゃんねる';return chrome(`<div class="board-head"><div><h1>livegalileo@3ch掲示板</h1><div class="related-boards" aria-label="関連板">関連板：<a href="#board" data-action="related-board" data-board="なんでも実況J">なんでも実況J</a>、<a href="#board" data-action="related-board" data-board="なんでも実況U">なんでも実況U</a>、<a href="#board" data-action="related-board" data-board="ニュース速報">ニュース速報</a></div>${details()}</div><button class="btn primary" data-action="new">＋ スレッド作成</button></div><div class="layout"><main class="main"><section class="panel"><div class="toolbar"><div class="tabs"><button class="tab ${state.mode==='feed'?'active':''}" data-mode="feed">スレッドフィード</button><button class="tab ${state.mode==='list'?'active':''}" data-mode="list">スレ一覧</button><button class="tab ${state.mode==='recommend'?'active':''}" data-mode="recommend">おすすめ3ちゃんねる</button></div><div class="right-controls"><input class="search" id="boardSearch" type="search" placeholder="スレッドを検索" value="${escape(state.query)}" aria-label="スレッドを検索"><select class="select" id="sort"><option value="new" ${state.sort==='new'?'selected':''}>新着順</option><option value="speed" ${state.sort==='speed'?'selected':''}>勢い順</option><option value="res" ${state.sort==='res'?'selected':''}>レス数順</option></select></div></div><div class="info">${state.mode==='feed'?'この板のスレッドを表示。>>1と最新レスの間から過去レスを展開できます。':state.mode==='list'?'この板のスレッドを高密度な一覧で表示します。':'他の板も含めたおすすめスレッドを表示します。'}　<span id="count">${getFiltered().length}件表示中</span></div><div id="feedContent">${rowsHTML()}</div><div id="feedSentinel" class="loading" ${state.mode==='recommend'?'hidden':''}>${state.query?'検索中は自動追加読み込みを停止しています':'下へスクロールして続きを読み込む ↓'}</div><div class="loading" ${state.mode==='recommend'?'hidden':''}><button class="btn tiny" id="loadMore">さらに読み込む</button></div></section></main>${side()}</div>`)}
function rowsHTML(){const ts=getFiltered();if(!ts.length)return '<div class="empty">該当するスレッドがありません</div>';return state.mode!=='list'?ts.map(card).join(''):`<div class="list-head"><span>スレッド名</span><span>最終更新</span><span class="num">勢い</span><span class="num">レス</span></div>${ts.map(listRow).join('')}`}
function thread(){let t=threads.find(t=>t.id===state.threadId)||threads[0];seedPosts(t);let matched=t.postList.filter(p=>!state.searchThread||p.text.toLowerCase().includes(state.searchThread.toLowerCase())||p.name.includes(state.searchThread));const visible=matched.slice(Math.max(0,matched.length-state.shownPosts));document.title=t.title+' — 3ちゃんねる';return chrome(`<h1 class="thread-title">${escape(t.title)}</h1><div class="thread-meta">${escape(t.board)} · ${t.res}レス · 更新 ${time(t.age)}</div><div class="thread-actions"><button class="btn tiny" data-action="board">← スレ一覧</button><button class="btn tiny" data-action="first">最初から</button><button class="btn tiny" data-action="last">最新50</button><button class="btn tiny" data-action="settings">表示設定</button><input type="search" class="search" id="threadSearch" placeholder="スレ内検索" value="${escape(state.searchThread)}" aria-label="スレ内検索"></div>${t.res>=1000?'<div class="notice">このスレッドは1000レスに達しました。閲覧は引き続き可能です。</div>':''}<div class="layout"><main class="main"><section class="panel thread-panel" id="posts">${visible.map(postHTML).join('')||'<div class="empty">一致するレスはありません</div>'}</section><div class="loading"><button class="btn" data-action="older">さらに古いレスを表示</button><p class="muted">表示中 ${visible.length} / ${matched.length} レス</p></div><section class="panel compose" id="composer"><h3>レスを書き込む</h3><div class="compose-fields"><input id="postName" placeholder="名前（省略可）" maxlength="50"><input id="postMail" placeholder="メール（省略可）" maxlength="80"></div><textarea id="postText" placeholder="本文を入力してください"></textarea><div class="compose-foot"><span class="muted">プロトタイプ：送信内容はページ内のみ反映</span><button class="btn primary" data-action="send">書き込む</button></div></section></main>${side()}</div>`)}
function render(keepScroll=false){const y=window.scrollY;$('#app').innerHTML=state.page==='board'?board():thread();document.body.classList.toggle('compact',state.compact);bindObserver();if(keepScroll)window.scrollTo(0,y);else window.scrollTo(0,0)}
let observer=null;function bindObserver(){if(observer)observer.disconnect();const el=$('#feedSentinel');if(!el||state.query||state.finished||state.mode==='recommend')return;observer=new IntersectionObserver(items=>{if(items[0].isIntersecting&&window.scrollY>150)loadMore()},{rootMargin:'150px'});observer.observe(el)}
function loadMore(){if(state.page!=='board'||state.mode==='recommend'||state.loading||state.query||state.finished)return;state.loading=true;const sentinel=$('#feedSentinel');if(sentinel)sentinel.textContent='続きを読み込んでいます…';setTimeout(()=>{let base=threads.length;for(let i=0;i<8;i++){threads.push(makeThread(base+i,'old'))}state.batch++;state.loading=false;const target=$('#feedContent');if(target){target.innerHTML=rowsHTML();$('#count').textContent=getFiltered().length+'件表示中';$('#feedSentinel').textContent=`${state.batch}ページ追加読み込み済み · さらに下へスクロール`;bindObserver()}},270)}
function toast(m){const el=$('#toast');el.textContent=m;el.hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>el.hidden=true,2300)}
function modal(html){$('#modalHost').innerHTML=`<div class="modal-bg" id="modalBg"><div class="modal" role="dialog" aria-modal="true">${html}</div></div>`}
function closeModal(){$('#modalHost').innerHTML=''}
function settings(){modal(`<h2>表示設定</h2><p class="muted">この設定はプロトタイプ内のみ有効です。</p><div class="setting-row"><span>コンパクト表示</span><input id="compactSetting" type="checkbox" ${state.compact?'checked':''} style="width:auto"></div><div class="setting-row" hidden><span>フィードの追加読み込み元</span><select id="modalSource" class="select"><option value="old" ${state.moreSource==='old'?'selected':''}>同じ板の古いスレッド</option><option value="related" ${state.moreSource==='related'?'selected':''}>他板の関連スレッド</option><option value="mix" ${state.moreSource==='mix'?'selected':''}>混合</option></select></div><p class="muted">※ メインフィードは同じ板の古いスレッドを追加表示します。</p><div class="modal-actions"><button class="btn" data-action="close">閉じる</button><button class="btn primary" data-action="save-settings">適用</button></div>`)}
function newThread(){modal(`<h2>新規スレッド作成</h2><label>スレッドタイトル</label><input id="newTitle" maxlength="120" placeholder="スレッドタイトルを入力"><label>名前（省略可）</label><input id="newName" placeholder="名無しさん"><label>本文</label><textarea id="newBody" placeholder="最初のレスを入力"></textarea><div class="modal-actions"><button class="btn" data-action="close">キャンセル</button><button class="btn primary" data-action="create-thread">スレッドを作成</button></div>`)}
function goThread(id){const t=threads.find(x=>x.id===Number(id));if(!t)return;state.threadId=t.id;state.page='thread';state.shownPosts=30;state.searchThread='';render();location.hash='thread/'+id}
function boardGo(){state.page='board';render();location.hash='board'}
document.addEventListener('click',e=>{const item=e.target.closest('[data-thread],[data-action],[data-mode],[data-sidetab]');if(!item)return;const sideTab=item.dataset.sidetab;if(sideTab){state.sideTab=sideTab;render(true);return}const mode=item.dataset.mode;if(mode){state.mode=mode;render(true);return}if(item.dataset.thread){e.preventDefault();goThread(item.dataset.thread);return}const action=item.dataset.action;if(!action)return;e.preventDefault();if(action==='board')boardGo();if(action==='related-board'){toast(item.dataset.board+'（関連板リンクのデモ）')}if(action==='focus-search'){boardGo();setTimeout(()=>$('#boardSearch')?.focus(),0)}if(action==='details'){const el=document.getElementById(item.dataset.detail);el.hidden=!el.hidden}if(action==='settings')settings();if(action==='recommendations'){state.mode='recommend';boardGo()}if(action==='new')newThread();if(action==='close')closeModal();if(action==='expand'){let id=+item.dataset.id;let current=state.expanded.get(id)||0;state.expanded.set(id,current?current+100:10);render(true)}if(action==='collapse'){state.expanded.set(+item.dataset.id,0);render(true)}if(action==='reply-ref'){const c=$('#postText');if(c){c.value+='>>'+item.dataset.ref+'\n';c.focus()}else toast('スレッドを開くと返信できます')}if(action==='copy-post'){navigator.clipboard?.writeText('>>'+item.dataset.ref);toast('レス番号をコピーしました')}if(action==='last'){state.shownPosts=50;state.searchThread='';render(true)}if(action==='first'){state.shownPosts=9999;render(true)}if(action==='older'){state.shownPosts+=100;render(true)}if(action==='save-settings'){state.compact=$('#compactSetting').checked;state.moreSource=$('#modalSource').value;closeModal();render(true);toast('設定を反映しました')}if(action==='create-thread'){const title=$('#newTitle').value.trim(),body=$('#newBody').value.trim();if(!title||!body){toast('タイトルと本文を入力してください');return}const t=makeThread(threads.length);t.title=title;t.body=body;t.res=1;t.age=0;t.postList=[{n:1,name:$('#newName').value.trim()||'名無しさん',text:body,min:0}];threads.unshift(t);closeModal();goThread(t.id);toast('デモスレッドを作成しました')}if(action==='send'){const input=$('#postText');const value=input?.value.trim();if(!value){toast('本文を入力してください');return}const t=threads.find(t=>t.id===state.threadId);let n=t.postList.length+1;t.postList.push({n,name:$('#postName').value.trim()||'名無しさん',text:value,min:0});t.res=t.postList.length;state.shownPosts=Math.max(state.shownPosts,30);render();setTimeout(()=>window.scrollTo(0,document.body.scrollHeight),0);toast('デモレスを投稿しました')}});
document.addEventListener('input',e=>{if(e.target.id==='boardSearch'){state.query=e.target.value;$('#feedContent').innerHTML=rowsHTML();$('#count').textContent=getFiltered().length+'件表示中';bindObserver()}if(e.target.id==='threadSearch'){state.searchThread=e.target.value;const pos=window.scrollY;const t=threads.find(t=>t.id===state.threadId);seedPosts(t);const matched=t.postList.filter(p=>!state.searchThread||p.text.toLowerCase().includes(state.searchThread.toLowerCase())||p.name.includes(state.searchThread));$('#posts').innerHTML=matched.slice(-state.shownPosts).map(postHTML).join('')||'<div class="empty">一致するレスはありません</div>';window.scrollTo(0,pos)}});
document.addEventListener('change',e=>{if(e.target.id==='sort'){state.sort=e.target.value;$('#feedContent').innerHTML=rowsHTML()}if(e.target.id==='sideSource'){state.moreSource=e.target.value;toast('次回の追加読み込みから適用します')}});
document.addEventListener('click',e=>{if(e.target.id==='loadMore')loadMore();if(e.target.id==='register'||e.target.id==='login'){state.logged=true;$('#register').hidden=true;$('#login').hidden=true;$('#userWrap').hidden=false;toast('デモとしてログインしました')}if(e.target.id==='logout'){state.logged=false;$('#register').hidden=false;$('#login').hidden=false;$('#userWrap').hidden=true;toast('ログアウトしました')}if(e.target.id==='userToggle')$('#userDrop').hidden=!$('#userDrop').hidden;if(e.target.id==='mobileToggle')$('#mobileDrop').hidden=!$('#mobileDrop').hidden;if(e.target.id==='modalBg')closeModal()});
window.addEventListener('hashchange',()=>{const match=location.hash.match(/^#thread\/(\d+)/);if(match&&state.threadId!==Number(match[1]))goThread(Number(match[1]));else if(location.hash==='#board'&&state.page!=='board')boardGo()});const match=location.hash.match(/^#thread\/(\d+)/);if(match){state.threadId=Number(match[1]);state.page='thread'}render();
})();
</script>
</body></html>
